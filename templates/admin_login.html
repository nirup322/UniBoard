<!DOCTYPE html>
<html>
<head>
    <title>UniBoard — Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <span><span class="wordmark">UniBoard</span><span class="tagline">Administrator Access</span></span>
        <nav><a href="/student/login">Student Login</a></nav>
    </div>

    <div class="split-auth">
        <div class="split-auth__panel">
            <p class="wordmark-lg">UniBoard</p>
            <p class="panel-tagline">Administrator Console</p>
            <p class="panel-note">Manage student records, update attendance, and post results — all from a single register.</p>
        </div>
        <div class="split-auth__form">
            <div class="card">
                <h1>Admin Login</h1>
                <p class="subtext" style="margin:0 0 20px;">Sign in to manage student records.</p>

                {% if error %}
                    <div class="alert alert-error">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/admin/login">
                    <div class="field">
                        <label>Username</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="field">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>
                    <button type="submit" class="btn">Log In</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
