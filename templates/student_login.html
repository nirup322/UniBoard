<!DOCTYPE html>
<html>
<head>
    <title>UniBoard — Student Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="topbar">
        <span><span class="wordmark">UniBoard</span><span class="tagline">Student Information Register</span></span>
        <nav><a href="/admin/login">Admin</a></nav>
    </div>

    <div class="page-narrow">
        <div class="card">
            <h1>Student Login</h1>
            <p class="subtext" style="margin:0 0 20px;">Enter your USN and date of birth to view your record.</p>

            {% if error %}
                <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/student/login">
                <div class="field">
                    <label>USN</label>
                    <input type="text" name="usn" placeholder="1AB21CS001" required>
                </div>
                <div class="field">
                    <label>Date of Birth</label>
                    <input type="date" name="dob" required>
                </div>
                <button type="submit" class="btn">Log In</button>
            </form>
        </div>
    </div>
</body>
</html>
