name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: test_root_password
      DB_NAME: uniboard_test
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      FLASK_SECRET_KEY: test-secret-key

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Load schema into test database
        run: |
          sed 's/uniboard/uniboard_test/g' schema_mysql.sql | \
            mysql -h 127.0.0.1 -P 3306 -u root -ptest_root_password

      - name: Run tests
        run: pytest tests/ -v